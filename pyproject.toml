[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "itermux-bridge"
version = "0.1.0"
description = "Bridge iTerm2 into the real tmux protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "wsvn53" }]
keywords = ["tmux", "iterm2", "terminal", "macos"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = ["iterm2>=2.7"]

[project.urls]
Homepage = "https://github.com/wsvn53/itermux-bridge"

[project.scripts]
itermux-bridge = "itermux_bridge.cli:main"

[tool.setuptools]
packages = ["itermux_bridge", "itermux_bridge.iterm"]
